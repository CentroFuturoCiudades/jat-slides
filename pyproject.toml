[project]
name = "jat-slides"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.17.0",
    "contextily>=1.7.0",
    "dagster>=1.12.3",
    "cfc-dagster-utils[postgres]>=0.4.1",
    "dagster-dg-cli>=1.12.3",
    "dagster-webserver>=1.12.3",
    "geopandas>=1.1.1",
    "ipykernel<7",
    "jenkspy>=0.4.1",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.2.250926",
    "psycopg2>=2.9.11",
    "python-pptx>=1.0.2",
    "rasterio>=1.4.3",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.48",
    "toml>=0.10.2",
    "types-geopandas>=1.1.1.20250829",
    "pyarrow>=25.0.0",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY001", "ERA001", "PLR2004"]
per-file-ignores = { "*.ipynb" = ["PLR0913"] }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "jat_slides"
registry_modules = ["jat_slides.definitions"]

[tool.uv.sources]
cfc-dagster-utils = { git = "https://github.com/RodolfoFigueroa/cfc-dagster-utils" }

[dependency-groups]
dev = [
    "dvc[azure]>=3.67.1",
    "pre-commit>=4.5.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.67",
]
